[tool.poetry]
name = "chefs-to-jira"
version = "0.1.0"
description = "Take CHEFS Data to JIRA issues"
authors = ["DMI"]
readme = "README.md"


packages = [
    { include = "cdogs_helpers", from = "src" },
    { include = "chefs_helpers", from = "src" },
    { include = "jira_helpers", from = "src" },
    { include = "tests", from = "." },
    { include = "utilities", from = "src" }
]


[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.0.0"
python-dotenv = ">=1.0"
jira = "^3.10.5"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"
ruff = "^0.16.2"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.setuptools]
package-dir = {"" = "src"}
